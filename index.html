<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="ScanCart scans real product barcodes, identifies products, and verifies package information." />
    <meta property="og:title" content="ScanCart" />
    <meta property="og:description" content="Scan real product barcodes and build your cart." />
    <meta property="og:type" content="website" />
    <title>ScanCart, Scan as you shop</title>
    <link rel="stylesheet" href="/src/scanner.css" />
    <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>
    <script>
      (() => {
        let video = null
        let stream = null
        let controls = null
        let detectionHandler = null
        let fallbackTimer = null
        let started = false
        const ZXing = window.ZXingBrowser

        function stopDecoder() {
          try { controls?.stop?.() } catch (_) {}
          controls = null
          if (fallbackTimer) window.clearInterval(fallbackTimer)
          fallbackTimer = null
        }

        const scannerAdapter = {
          init(config, callback) {
            const target = config?.inputStream?.target
            if (!target || !navigator.mediaDevices?.getUserMedia) {
              callback(new Error('Camera access is not available in this browser.'))
              return
            }
            target.innerHTML = ''
            video = document.createElement('video')
            video.autoplay = true
            video.muted = true
            video.playsInline = true
            video.setAttribute('playsinline', '')
            video.setAttribute('webkit-playsinline', '')
            video.setAttribute('aria-label', 'ScanCart live barcode camera')
            video.style.width = '100%'
            video.style.height = '100%'
            video.style.objectFit = 'cover'
            target.appendChild(video)

            navigator.mediaDevices.getUserMedia({
              audio: false,
              video: {
                facingMode: { ideal: 'environment' },
                width: { ideal: 1920, min: 640 },
                height: { ideal: 1080, min: 480 },
                frameRate: { ideal: 30, max: 60 },
              },
            }).then(async media => {
              stream = media
              video.srcObject = media
              await video.play().catch(() => {})
              const track = media.getVideoTracks()[0]
              const caps = track?.getCapabilities?.() || {}
              const advanced = []
              if (Array.isArray(caps.focusMode) && caps.focusMode.includes('continuous')) advanced.push({ focusMode: 'continuous' })
              if (typeof caps.zoom?.max === 'number' && caps.zoom.max > 1) advanced.push({ zoom: Math.min(2, caps.zoom.max) })
              if (advanced.length && track.applyConstraints) await track.applyConstraints({ advanced }).catch(() => {})
              callback(null)
            }).catch(error => {
              video?.remove()
              video = null
              callback(error)
            })
          },

          start() {
            started = true
            if (detectionHandler) this.onDetected(detectionHandler)
          },

          onDetected(handler) {
            detectionHandler = handler
            if (!started || !video) return
            stopDecoder()

            if (ZXing) {
              try {
                const Reader = ZXing.BrowserMultiFormatOneDReader || ZXing.BrowserMultiFormatReader
                if (!Reader) throw new Error('ZXing barcode reader is unavailable.')
                const reader = new Reader()
                const begin = () => {
                  try {
                    const result = reader.decodeFromVideoElement(video, decoded => {
                      const text = decoded?.getText?.() || ''
                      if (text && detectionHandler) detectionHandler({ codeResult: { code: text } })
                    })
                    Promise.resolve(result).then(value => { controls = value }).catch(() => {})
                  } catch (_) {}
                }
                if (video.readyState >= 2) begin()
                else video.addEventListener('loadeddata', begin, { once: true })
                return
              } catch (_) {}
            }

            if ('BarcodeDetector' in window) {
              try {
                const Detector = window.BarcodeDetector
                const detector = new Detector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'] })
                const canvas = document.createElement('canvas')
                const ctx = canvas.getContext('2d', { willReadFrequently: true })
                fallbackTimer = window.setInterval(async () => {
                  if (!video || !ctx || video.readyState < 2) return
                  canvas.width = video.videoWidth
                  canvas.height = video.videoHeight
                  ctx.drawImage(video, 0, 0, canvas.width, canvas.height)
                  try {
                    const results = await detector.detect(canvas)
                    const text = results?.[0]?.rawValue || ''
                    if (text && detectionHandler) detectionHandler({ codeResult: { code: text } })
                  } catch (_) {}
                }, 250)
              } catch (_) {}
            }
          },

          stop() {
            stopDecoder()
            started = false
            if (stream) {
              stream.getTracks().forEach(track => track.stop())
              stream = null
            }
            if (video) {
              video.pause()
              video.srcObject = null
              video.remove()
              video = null
            }
            detectionHandler = null
          },
        }

        window.Quagga = scannerAdapter
        // The adapter owns ZXing. ScanCartApp must not start a second decoder on the same video.
        window.ZXingBrowser = undefined
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
